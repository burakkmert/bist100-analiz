name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fon
          POSTGRES_PASSWORD: fon
          POSTGRES_DB: fontakip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fon:fon@localhost:5432/fontakip_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (Kişi 2 kodu; app/ai hariç)
        run: ruff check . ../engine && ruff format --check . ../engine
      - name: Pytest — backend (Kişi 2)
        run: pytest tests -q
      - name: Pytest — yapay zekâ katmanı (Kişi 3)
        run: pytest app/ai/tests -q

  ml-data:
    name: Veri ve model testleri (Kişi 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # PyTorch/model/internet gerekmez: modeller sahte nesnelerle test ediliyor
      - run: pip install pandas numpy pyyaml pyarrow scipy statsmodels pytest
      - run: pytest data/tests ml/tests backtest/tests -q

  mobile:
    name: Mobil (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
